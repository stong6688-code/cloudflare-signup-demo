<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎报名 - 官方在线活动预约</title>
    <!-- 引入 Tailwind CSS (免编译 CDN 版) -->
    <script src="https://tailwindcss.com"></script>
    <script>
        // 自定义 Tailwind 配置，方便后续一键改色
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased">

    <!-- 核心卡片容器 (带现代渐变微光边框效果) -->
    <div class="relative w-full max-w-md">
        <!-- 背景炫光装饰，增添科技感（可选） -->
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse"></div>

        <!-- 主卡片 (毛玻璃/半透明磨砂效果) -->
        <div class="relative backdrop-blur-md bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
            
            <!-- 头部 Title 区域 -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-500/10 text-brand-500 mb-3 border border-brand-500/20">
                    <!-- 现代化的日历/报名小图标 -->
                    <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">活动在线预约</h1>
                <p class="text-slate-400 text-sm mt-1">请填写下方真实信息完成报名</p>
            </div>

            <!-- 表单区域 -->
            <form id="signupForm" onsubmit="handleSubmit(event)" class="space-y-5">
                <!-- 姓名输入框 -->
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2" for="username">姓名</label>
                    <div class="relative">
                        <input type="text" id="username" required 
                            class="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition duration-200"
                            placeholder="请输入您的姓名">
                    </div>
                </div>

                <!-- 手机号输入框 -->
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2" for="userphone">手机号</label>
                    <div class="relative">
                        <input type="tel" id="userphone" required 
                            class="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition duration-200"
                            placeholder="请输入11位手机号">
                    </div>
                </div>

                <!-- 提交按钮 (带细腻的渐变和阴影效果) -->
                <div class="pt-2">
                    <button type="submit" id="submitBtn" 
                        class="w-full bg-gradient-to-r from-brand-500 to-indigo-600 hover:from-brand-600 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-brand-500/20 active:scale-[0.98] transition duration-150 flex items-center justify-center space-x-2 cursor-pointer">
                        <span>立即提交报名</span>
                    </button>
                </div>
            </form>

            <!-- 动态结果状态弹窗 -->
            <div id="msgBox" style="display: none;" class="mt-5 p-4 rounded-xl text-sm font-medium border text-center transition duration-300"></div>
        </div>
        
        <!-- 底部版权或弱提示 -->
        <p class="text-center text-slate-500 text-xs mt-6">© 2026 基于 Cloudflare 全栈架构提供安全技术支持</p>
    </div>

    <script>
        // 前端表单提交 (保持与后端 API 的完美对接)
        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');
            
            // 提交状态优化
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>正在提交安全验证...</span>
            `;
            submitBtn.disabled = true;
            msgBox.style.display = 'none';

            const payload = {
                name: document.getElementById('username').value,
                phone: document.getElementById('userphone').value
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                msgBox.style.display = 'block';
                if (res.ok) {
                    // 成功状态样式优化
                    msgBox.className = 'mt-5 p-4 rounded-xl text-sm font-medium border text-center bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
                    msgBox.innerText = '🎉 ' + (data.msg || '报名成功！');
                    document.getElementById('signupForm').reset();
                } else {
                    // 失败状态样式优化
                    msgBox.className = 'mt-5 p-4 rounded-xl text-sm font-medium border text-center bg-rose-500/10 border-rose-500/30 text-rose-400';
                    msgBox.innerText = '❌ ' + (data.msg || '报名失败，请检查输入');
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'mt-5 p-4 rounded-xl text-sm font-medium border text-center bg-rose-500/10 border-rose-500/30 text-rose-400';
                msgBox.innerText = '⚠️ 网络连接超时，请稍后再试';
            } finally {
                submitBtn.innerHTML = '<span>立即提交报名</span>';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
