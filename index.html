<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动报名与管理系统</title>
    <!-- 使用更稳定的前端原生 JS 脚本，无需 Vue 编译，100% 兼容任何浏览器加载 -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-btn { float: right; background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        h2 { color: #007bff; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; font-size: 16px; }
        .btn-submit { width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #0056b3; }
        .alert { padding: 12px; border-radius: 6px; margin-top: 20px; text-align: center; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #dee2e6; text-align: left; }
        th { background: #f8f9fa; }
        .badge { background: #17a2b8; color: white; padding: 5px 10px; border-radius: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 切换按钮 -->
        <button class="nav-btn" id="toggleBtn" onclick="toggleView()">切换到后台管理</button>
        
        <!-- 报名视图 -->
        <div id="userView">
            <h2>活动在线报名</h2>
            <form id="signupForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="username" required placeholder="请输入您的姓名">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="userphone" required placeholder="请输入您的手机号">
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">立即报名</button>
            </form>
            <div id="msgBox" style="display: none;"></div>
        </div>

        <!-- 后台视图 -->
        <div id="adminView" style="display: none;">
            <h2>后台管理看板 <button onclick="fetchAdminData()" style="font-size:12px; cursor:pointer;">🔄 刷新</button></h2>
            <p>总报名人数：<span class="badge" id="totalCount">0</span></p>
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>手机号</th>
                        <th>报名时间</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="3" style="text-align:center; color:#999;">正在加载数据...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let isAdminView = false;

        // 视图切换
        function toggleView() {
            isAdminView = !isAdminView;
            const userView = document.getElementById('userView');
            const adminView = document.getElementById('adminView');
            const toggleBtn = document.getElementById('toggleBtn');
            
            if (isAdminView) {
                userView.style.display = 'none';
                adminView.style.display = 'block';
                toggleBtn.innerText = '切换到用户报名';
                fetchAdminData();
            } else {
                userView.style.display = 'block';
                adminView.style.display = 'none';
                toggleBtn.innerText = '切换到后台管理';
            }
        }

        // 前端表单提交 (原生 Fetch 请求)
        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');
            
            submitBtn.innerText = '提交中...';
            submitBtn.disabled = true;
            msgBox.style.display = 'none';

            const payload = {
                name: document.getElementById('username').value,
                phone: document.getElementById('userphone').value
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                msgBox.style.display = 'block';
                if (res.ok) {
                    msgBox.className = 'alert alert-success';
                    msgBox.innerText = data.msg || '报名成功！';
                    document.getElementById('signupForm').reset();
                } else {
                    msgBox.className = 'alert alert-danger';
                    msgBox.innerText = data.msg || '报名失败';
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'alert alert-danger';
                msgBox.innerText = '网络错误，请稍后再试';
            } finally {
                submitBtn.innerText = '立即报名';
                submitBtn.disabled = false;
            }
        }

        // 后台数据拉取 (原生 Fetch 请求)
        async function fetchAdminData() {
            const tbody = document.getElementById('userTableBody');
            try {
                const res = await fetch('/api/admin');
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                
                document.getElementById('totalCount').innerText = data.total;
                
                if (data.users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">暂无报名数据</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.users.map(u => `
                    <tr>
                        <td>${escapeHtml(u.name)}</td>
                        <td>${escapeHtml(u.phone)}</td>
                        <td>${new Date(u.time).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">无法获取数据，请确保已正确绑定 KV 空间</td></tr>`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
