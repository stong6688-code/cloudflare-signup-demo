<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎报名 - 官方在线活动预约</title>
    <!-- 引入极速且极其稳定的优雅 UI 框架 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        main.container {
            max-width: 460px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        /* 核心改动：利用 flex 和两端对齐，让标签文本宽度绝对一致且左右对齐 */
        .form-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 22px;
        }
        .form-item label {
            width: 50px; /* 固定一个宽度，让两个 label 的容器一模一样大 */
            color: #cbd5e1;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            text-align: justify;
            text-align-last: justify; /* 强制文字在 50px 宽度内向两端对齐散开 */
        }
        
        input {
            background-color: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 12px !important;
            margin-bottom: 0 !important; /* 消除 Pico 默认的底部间距，完全由外层控制 */
        }
        input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3) !important;
        }
        button[type="submit"] {
            background: linear-gradient(90deg, #3b82f6 0%, #4f46e5 100%);
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            width: 100%;
            margin: 10px 0 0 0;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .alert-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            animation: fadeIn 0.3s ease;
        }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
        .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
        .copyright { text-align: center; color: #475569; font-size: 11px; margin-top: 25px; margin-bottom: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <main class="container">
        <h1>活动在线预约</h1>
        <p class="subtitle">请填写下方真实信息完成报名</p>

        <!-- 表单区域 -->
        <form id="signupForm" onsubmit="handleSubmit(event)">
            <div class="form-item">
                <label for="username">姓名</label>
                <input type="text" id="username" required placeholder="请输入您的姓名">
            </div>

            <div class="form-item">
                <label for="userphone">手机号</label>
                <input type="tel" id="userphone" required placeholder="请输入11位手机号">
            </div>

            <button type="submit" id="submitBtn">立即提交报名</button>
        </form>

        <!-- 动态结果状态区 -->
        <div id="msgBox" style="display: none;" class="alert-box"></div>
        
        <p class="copyright">© 2026 基于 Cloudflare 全栈架构提供 safe 技术支持</p>
    </main>

    <script>
        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');
            
            submitBtn.innerText = '正在提交安全验证...';
            submitBtn.disabled = true;
            msgBox.style.display = 'none';

            const payload = {
                name: document.getElementById('username').value,
                phone: document.getElementById('userphone').value
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                msgBox.style.display = 'block';
                if (res.ok) {
                    msgBox.className = 'alert-box alert-success';
                    msgBox.innerText = '🎉 ' + (data.msg || '报名成功！');
                    document.getElementById('signupForm').reset();
                } else {
                    msgBox.className = 'alert-box alert-danger';
                    msgBox.innerText = '❌ ' + (data.msg || '报名失败，请检查输入');
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'alert-box alert-danger';
                msgBox.innerText = '⚠️ 网络连接超时，请稍后再试';
            } finally {
                submitBtn.innerText = '立即提交报名';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
