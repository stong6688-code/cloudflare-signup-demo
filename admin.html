<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理控制台 - 数据看板</title>
    <!-- 引入极速且稳定的 Pico UI 框架 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%) !important;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
        }
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        /* 锁屏/密码输入卡片 */
        .lock-container {
            max-width: 400px;
            margin: 100px auto 0 auto;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        /* 主控制面板 */
        .dashboard {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.4s ease;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .dash-header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* 统计区块 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-label { color: #94a3b8; font-size: 14px; font-weight: 500; }
        .stat-value { color: #3b82f6; font-size: 36px; font-weight: 800; margin-top: 5px; }
        
        /* 响应式精致表格 */
        .table-container {
            overflow-x: auto;
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }
        table { margin: 0 !important; width: 100%; border-collapse: collapse; }
        th { background-color: rgba(255, 255, 255, 0.02) !important; color: #94a3b8 !important; font-weight: 600 !important; font-size: 14px; padding: 14px 18px !important; }
        td { padding: 14px 18px !important; border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important; font-size: 15px; color: #cbd5e1; }
        tr:last-child td { border-bottom: none !important; }
        
        /* 原生输入框与按钮精修 */
        input[type="password"] {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
        }
        .btn-action {
            background: linear-gradient(90deg, #1e40af 0%, #3b82f6 100%) !important;
            border: none !important;
            font-weight: 600;
            padding: 8px 18px !important;
            border-radius: 8px !important;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- 身份验证屏 (初始显示) -->
        <div id="lockScreen" class="lock-container">
            <h3 style="color:#fff; margin-bottom: 10px;">安全控制台</h3>
            <p style="color:#64748b; font-size:14px; margin-bottom: 20px;">请输入管理员口令以访问数据</p>
            <input type="password" id="adminPassword" placeholder="请输入密码" style="margin-bottom: 15px;">
            <button onclick="verifyPassword()" style="width:100%; background:#3b82f6; border:none; border-radius:8px;">解锁进入</button>
            <p id="lockError" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">⚠️ 口令错误，拒绝访问</p>
        </div>

        <!-- 数据主看板 (初始隐藏) -->
        <div id="mainDashboard" class="dashboard" style="display: none;">
            <div class="dash-header">
                <h1>活动报名管理看板</h1>
                <button class="btn-action" onclick="fetchAdminData()">🔄 刷新数据</button>
            </div>

            <!-- 顶置统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">当前总报名用户</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">系统状态</div>
                    <div class="stat-value" style="color: #10b981; font-size: 24px; padding-top:10px;">● 运行正常</div>
                </div>
            </div>

            <!-- 数据明细表格 -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>序列</th>
                            <th>客户姓名</th>
                            <th>客户手机号</th>
                            <th>预约提交时间</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="4" style="text-align:center; color:#64748b;">数据加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 【自定义密码配置项】你可以在这里修改你的后台进入密码
        const CORRECT_PASSWORD = "CN_123456_Cloudflare"; 

        // 前端本地密码验证机制
        function verifyPassword() {
            const inputPwd = document.getElementById('adminPassword').value;
            const errorHint = document.getElementById('lockError');
            
            if (inputPwd === CORRECT_PASSWORD) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                fetchAdminData(); // 验证成功，立即抓取 KV 数据
            } else {
                errorHint.style.display = 'block';
                document.getElementById('adminPassword').value = '';
            }
        }

        // 从 Cloudflare 后端获取真实的报名名单
        async function fetchAdminData() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#64748b;">正在实时同步云端 KV 数据库...</td></tr>`;
            
            try {
                const res = await fetch('/api/admin');
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                document.getElementById('totalCount').innerText = data.total;
                
                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#64748b;">当前暂无客户报名数据</td></tr>`;
                    return;
                }

                // 循环渲染出精美的表格行
                tbody.innerHTML = data.users.map((u, index) => `
                    <tr>
                        <td style="color:#64748b; font-weight:600;">${index + 1}</td>
                        <td style="font-weight:600; color:#fff;">${escapeHtml(u.name)}</td>
                        <td>${escapeHtml(u.phone)}</td>
                        <td style="font-size:13px; color:#94a3b8;">${new Date(u.time).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#f87171; font-weight:600;">⚠️ 无法连接到服务器，请检查云端 KV 绑定状态</td></tr>`;
            }
        }

        // 安全防注入转义
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
