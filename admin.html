<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY CONTROL CENTER - 数据智脑中心</title>
    <style>
        /* 全局高端科技暗黑背景 */
        body {
            background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%) !important;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }

        .wrapper {
            width: 100%;
            max-width: 1000px;
        }

        /* 锁屏验证卡片 */
        .lock-container {
            width: 100%;
            max-width: 520px;
            margin: 60px auto 0 auto;
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 50px rgba(59, 130, 246, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            box-sizing: border-box;
            animation: panelSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .secure-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px auto;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        .lock-container h3 { font-size: 24px; font-weight: 800; color: #ffffff; margin: 0 0 8px 0; }
        .lock-container p { color: #9ca3af; font-size: 14px; margin: 0 0 35px 0; }

        /* 豪华全宽比例输入框 */
        input[type="password"], input[type="text"], input[type="tel"] {
            width: 100%;
            box-sizing: border-box;
            background: rgba(3, 7, 18, 0.6) !important;
            border: 1px solid #374151 !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            padding: 14px 20px !important;
            font-size: 16px !important;
            outline: none !important;
            transition: all 0.3s ease !important;
        }
        input[type="password"] { text-align: center; letter-spacing: 6px; }
        input[type="password"]::placeholder { letter-spacing: 0px; color: #4b5563; }
        input[type="password"]:focus, input[type="text"]:focus, input[type="tel"]:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 50%, #4f46e5 100%);
            background-size: 200% auto;
            color: #ffffff;
            border: none;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
            letter-spacing: 2px;
            margin-top: 20px;
        }
        .btn-unlock:hover {
            background-position: right center;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        #lockError { color: #f87171; font-size: 13px; margin: 15px 0 0 0; font-weight: 600; }

        /* 数据主看板大屏样式 */
        .dashboard {
            width: 100%;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-sizing: border-box;
            animation: panelSlideUp 0.5s ease;
        }

        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 25px; margin-bottom: 35px; }
        .dash-header h1 { font-size: 26px; font-weight: 900; margin: 0; background: linear-gradient(90deg, #ffffff, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-refresh { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; font-weight: 600; padding: 10px 20px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .btn-refresh:hover { background: rgba(255, 255, 255, 0.1); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: rgba(3, 7, 18, 0.4); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 25px; position: relative; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #3b82f6; }
        .stat-label { color: #9ca3af; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
        .stat-value { color: #ffffff; font-size: 42px; font-weight: 900; margin-top: 10px; font-family: monospace; }

        /* 精细表格 */
        .table-container { overflow-x: auto; background: rgba(3, 7, 18, 0.3); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 16px; }
        table { width: 100%; border-collapse: collapse; margin: 0; text-align: left; }
        th { background: rgba(255, 255, 255, 0.02); color: #9ca3af; font-weight: 700; font-size: 13px; padding: 18px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); letter-spacing: 1px; }
        td { padding: 18px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 15px; color: #e5e7eb; }
        tr:last-child td { border-bottom: none; }
        
        /* 核心改动：完美的精细化增删改操作按钮样式 */
        .btn-edit { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; margin-right: 8px; transition: all 0.2s; }
        .btn-edit:hover { background: #2563eb; color: #fff; }
        .btn-delete { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .btn-delete:hover { background: #dc2626; color: #fff; }

        @keyframes panelSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="wrapper">
        
        <!-- 安全口令解锁屏 -->
        <div id="lockScreen" class="lock-container">
            <div class="secure-icon">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 28px; height: 28px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                </svg>
            </div>
            <h3>控制台安全验证</h3>
            <p>请输入最高控制口令以同步云端 KV 数据库</p>
            <input type="password" id="adminPassword" placeholder="ENTER ACCESS CODE">
            <button class="btn-unlock" onclick="verifyPassword()">验证并解锁</button>
            <p id="lockError" style="display:none;">⚠️ 口令错误，访问请求已被系统拦截</p>
        </div>

        <!-- 数据主控制中心 -->
        <div id="mainDashboard" class="dashboard" style="display: none;">
            <div class="dash-header">
                <h1>活动数据智脑中心</h1>
                <button class="btn-refresh" onclick="fetchAdminData()">🔄 刷新云端数据</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">实时预约总人数</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Cloudflare Edge 状态</div>
                    <div class="stat-value" style="color: #10b981; font-size: 20px; font-weight:700; margin-top:20px;">● NODE ONLINE</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>预约姓名</th>
                            <th>联络电话</th>
                            <th>全时区提交时间</th>
                            <th style="text-align: center; width: 180px;">内部操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="5" style="text-align:center; color:#6b7280;">等待口令激活...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 独立的修改数据模态框弹窗 (使用了标准的 fixed 绝对居中布局，绝不产生样式冲突) -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(12px); z-index: 9999; align-items: center; justify-content: center;">
### 🧩 第二部分：后端数据联动大脑控制逻辑 (JavaScript)

这一部分完全打通了与 Cloudflare Functions 的 `DELETE` 和 `PUT` 交互。请紧接着上面的代码下方粘上去，完成文件的闭合：

```html
    <script>
        const CORRECT_PASSWORD = "CN_123456_Cloudflare"; 

function verifyPassword() {
    const inputPwd = document.getElementById('adminPassword').value;
    const errorHint = document.getElementById('lockError');
    
    if (inputPwd === CORRECT_PASSWORD) {
        // 【核心升级】：登录成功，记录当前时间戳到 localStorage 
        localStorage.setItem('admin_login_time', Date.now().toString());

        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        fetchAdminData();
    } else {
        errorHint.style.display = 'block';
        document.getElementById('adminPassword').value = '';
    }
}

        // 核心改动：渲染函数完美输出操作按钮
        async function fetchAdminData() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#6b7280;">正在与远程 Cloudflare Workers KV 建立安全同步通道...</td></tr>`;
            try {
                const res = await fetch('/api/admin');
                if (!res.ok) throw new Error();
                const data = await res.json();
                document.getElementById('totalCount').innerText = data.total;
                
                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#6b7280;">当前数据空间内未检测到任何预约记录</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.users.map((u, index) => `
                    <tr>
                        <td style="color:#4b5563; font-weight:700; font-family:monospace;">#${String(index + 1).padStart(3, '0')}</td>
                        <td style="font-weight:700; color:#ffffff;">${escapeHtml(u.name)}</td>
                        <td style="color:#9ca3af; font-family:monospace;">${escapeHtml(u.phone)}</td>
                        <td style="color:#6b7280; font-size:14px;">${new Date(u.time).toLocaleString()}</td>
                        <td style="text-align: center;">
                            <button class="btn-edit" onclick="openEditModal('${u.id}', '${escapeHtml(u.name)}', '${escapeHtml(u.phone)}')">编辑</button>
                            <button class="btn-delete" onclick="handleDelete('${u.id}')">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171; font-weight:600;">⚠️ 数据库同步中止，请核对 Edge KV 绑定链条</td></tr>`;
            }
        }

        // 执行异步删除
        async function handleDelete(id) {
            if (!confirm("⚠️ 确定要删除该用户的预约信息吗？此操作将实时从 Cloudflare KV 中抹去数据！")) return;
            try {
                const res = await fetch(`/api/manage?id=${id}`, { method: 'DELETE' });
                const data = await res.json();
                alert(data.msg || "删除成功");
                fetchAdminData(); 
            } catch (err) {
                alert("删除失败，请重试");
            }
        }

        // 弹窗控制
        function openEditModal(id, name, phone) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editUsername').value = name;
            document.getElementById('editUserphone').value = phone;
            // 使用 flex 展示以激活绝对居中
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // 提交修改更新
        async function submitEdit() {
            const id = document.getElementById('editUserId').value;
            const name = document.getElementById('editUsername').value;
            const phone = document.getElementById('editUserphone').value;
            try {
                const res = await fetch('/api/manage', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, name, phone })
                });
                const data = await res.json();
                alert(data.msg || "更新成功");
                closeEditModal();
                fetchAdminData(); 
            } catch (err) {
                alert("更新失败");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 每次打开网页或刷新时，自动检测登录是否在 2 小时内
window.addEventListener('DOMContentLoaded', () => {
    const loginTime = localStorage.getItem('admin_login_time');
    
    if (loginTime) {
        const timePassed = Date.now() - parseInt(loginTime, 10);
        const twoHours = 2 * 60 * 60 * 1000; // 2小时的毫秒数 (7200000ms)
        
        // 如果过去的时间小于 2 小时，直接免登进入
        if (timePassed < twoHours) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            fetchAdminData(); // 自动拉取最新的 KV 云端数据
            return;
        }
    }
    
    // 如果没有登录记录，或者已经超过 2 小时，保持原本的锁屏状态
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('mainDashboard').style.display = 'none';
});

// 可选功能：在后台大屏右侧或合适位置如果你想加一个“主动退出”按钮，可以调用这个函数
function handleLogout() {
    localStorage.removeItem('admin_login_time'); // 清除通行证
    window.location.reload(); // 刷新页面重新锁屏
}

    </script>
</body>
</html>
